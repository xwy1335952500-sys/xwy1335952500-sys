  <text class="mono body line l2" x="54" y="126">[ <tspan class="ok">OK</tspan> ] 加载产品思考 product-thinking.ai</text>
  <text class="mono body line l3" x="54" y="157">[ <tspan class="ok">OK</tspan> ] 挂载 /research    用户与场景</text>
  <text class="mono body line l4" x="54" y="188">[ <tspan class="ok">OK</tspan> ] 挂载 /prototype   交互与验证</text>
  <text class="mono body line l5" x="54" y="219">[ <tspan class="ok">OK</tspan> ] 挂载 /content     表达与叙事</text>

  <text class="mono prompt line l6" x="54" y="267">wenyi@studio ~ % <tspan class="body">whoami</tspan></text>
  <text class="mono body line l7" x="54" y="298">许雯怡 · AI Product Explorer</text>

  <text class="mono prompt line l8" x="54" y="346">wenyi@studio ~ % <tspan class="body">open github.profile</tspan></text>

  <text class="mono ready" x="54" y="389">SYSTEM READY</text>
  <text class="mono cta" x="500" y="448" text-anchor="middle">CLICK TO EXPLORE · xwy1335952500-sys</text>
