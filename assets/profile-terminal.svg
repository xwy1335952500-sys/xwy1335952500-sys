<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
  <title id="title">许雯怡的个人主页启动卡片</title>
  <desc id="desc">浅色终端风格的动态个人介绍</desc>
  <style>
    :root { color-scheme: light; }
    .window { fill: #f8fafc; stroke: #d8e2ea; stroke-width: 2; }
    .bar { fill: #f1f5f8; }
    .divider { stroke: #d8e2ea; stroke-width: 1; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Noto Sans Mono CJK SC", monospace; }
    .title { fill: #526579; font-size: 19px; font-weight: 700; }
    .meta { fill: #96a6b5; font-size: 12px; letter-spacing: .7px; }
    .body { fill: #596b7c; font-size: 16px; }
    .prompt { fill: #347bc7; font-size: 16px; font-weight: 700; }
    .ok { fill: #48a174; font-weight: 700; }
    .line { opacity: 0; animation: reveal 8s ease-in-out infinite; }
    .l1 { animation-delay: .12s; }
    .l2 { animation-delay: .44s; }
    .l3 { animation-delay: .76s; }
    .l4 { animation-delay: 1.08s; }
    .l5 { animation-delay: 1.40s; }
    .l6 { animation-delay: 1.72s; }
    .l7 { animation-delay: 2.04s; }
    .l8 { animation-delay: 2.36s; }
    .ready { fill: #347bc7; font-size: 17px; font-weight: 700; opacity: 0; animation: ready 8s ease-in-out infinite; }
    .cta { fill: #526579; font-size: 14px; letter-spacing: 1.6px; opacity: 0; animation: cta 8s ease-in-out infinite; }
    .arrow { fill: #347bc7; font-size: 22px; opacity: 0; animation: arrow 1.4s ease-in-out infinite; animation-delay: 3.8s; }
    @keyframes reveal {
      0%, 5% { opacity: 0; transform: translateY(5px); }
      10%, 77% { opacity: 1; transform: translateY(0); }
      88%, 100% { opacity: 0; transform: translateY(-2px); }
    }
    @keyframes ready {
      0%, 42% { opacity: 0; transform: translateY(5px); }
      48%, 82% { opacity: 1; transform: translateY(0); }
      92%, 100% { opacity: 0; }
    }
    @keyframes cta {
      0%, 50% { opacity: 0; }
      57%, 84% { opacity: 1; }
      92%, 100% { opacity: 0; }
    }
    @keyframes arrow {
      0%, 100% { opacity: .35; transform: translateX(0); }
      50% { opacity: 1; transform: translateX(7px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .line, .ready, .cta, .arrow { animation: none; opacity: 1; }
    }
  </style>

  <rect class="window" x="1" y="1" width="998" height="518" rx="18"/>
  <path class="bar" d="M19 2h962a18 18 0 0 1 18 18v31H1V20A18 18 0 0 1 19 2z"/>
  <line class="divider" x1="1" y1="52" x2="999" y2="52"/>
  <circle cx="24" cy="27" r="7" fill="#ef6461"/>
  <circle cx="47" cy="27" r="7" fill="#efbd4e"/>
  <circle cx="70" cy="27" r="7" fill="#55b96f"/>
  <text class="mono meta" x="500" y="31" text-anchor="middle">wenyi@studio — xwy1335952500-sys — 100×30</text>

